name: Build Meowcy

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Meowcy
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Configure Meowcy
        run: |
          chmod +x setup-hev.sh
          chmod +x build-debug.sh

          # Termux-specific override must never be used on GitHub.
          sed -i '/android\.aapt2FromMavenOverride/d' gradle.properties

          # hevlib depends on AndroidX annotation.
          if grep -q '^android.useAndroidX=' gradle.properties; then
            sed -i 's/^android\.useAndroidX=.*/android.useAndroidX=true/' gradle.properties
          else
            echo 'android.useAndroidX=true' >> gradle.properties
          fi

          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Download HEV Android library
        run: |
          ./setup-hev.sh

      - name: Build Meowcy
        run: |
          gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Show APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Meowcy APK
        uses: actions/upload-artifact@v4
        with:
          name: Meowcy-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
